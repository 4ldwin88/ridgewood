name: Deploy Gate 2A Prototype

on:
  push:
    branches:
      - gate2/reconciliation-foundation
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ridgewood-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Validate
        run: |
          npm run typecheck
          npm test
          npm run lint
      - name: Build prototype
        env:
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_lrUiFE9I4ryDIfXVlgujSg_yVeFBLRX
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    name: Verify deployed app
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Wait for Pages propagation and verify HTTP + app shell
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Verifying deployed Ridgewood app at ${PAGE_URL}"
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT

          for attempt in {1..12}; do
            status="$(curl --silent --show-error --location \
              --connect-timeout 10 --max-time 30 \
              --output "$body" --write-out '%{http_code}' \
              "$PAGE_URL" || true)"

            if [[ "$status" == "200" ]] \
              && grep -Eqi 'id=["'"']root["'"']' "$body" \
              && grep -Eqi '<script[^>]+src=' "$body"; then
              echo "Live Pages smoke test passed: HTTP 200 and Vite app shell detected."
              exit 0
            fi

            echo "Attempt ${attempt}/12 not ready (HTTP ${status:-curl-error}); retrying in 10s."
            sleep 10
          done

          echo "Live Pages smoke test failed. The build is deployed but is NOT ready for human testing." >&2
          echo "Response preview:" >&2
          head -c 1000 "$body" >&2 || true
          exit 1
