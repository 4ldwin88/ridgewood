name: Validate

on:
  push:
    branches:
      - build/beta-business-e2e
      - gate2/reconciliation-foundation
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate migration timestamp uniqueness
        shell: bash
        run: |
          set -euo pipefail
          duplicates="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sed -E 's/^([0-9]{14})_.*/\1/' | sort | uniq -d)"
          if [ -n "$duplicates" ]; then
            echo "Duplicate Supabase migration timestamp(s):"
            echo "$duplicates"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify recovered migration history
        run: python3 scripts/verify-migration-history.py

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  governed-form-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Preserve gesture failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: drawer-gesture-failure
          path: test-results/
      - name: Verify production Pages build
        env:
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_lrUiFE9I4ryDIfXVlgujSg_yVeFBLRX
          PAGE_URL: http://127.0.0.1:4175/ridgewood/
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          npm run build
          node scripts/write-release-manifest.mjs
          npx vite preview --host 127.0.0.1 --port 4175 > /tmp/ridgewood-preview.log 2>&1 &
          node scripts/verify-deployed-demo.mjs
